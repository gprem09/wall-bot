<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wall-Bot</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
      }
      body.presenting {
        cursor: none;
      }
      body.presenting .lil-gui,
      body.presenting .stats,
      body.presenting .cam-preview,
      body.presenting .toast {
        display: none !important;
      }
      .toast {
        position: fixed;
        left: 50%;
        top: 16px;
        transform: translate(-50%, -8px);
        max-width: 70vw;
        padding: 8px 14px;
        font: 13px/1.4 -apple-system, system-ui, sans-serif;
        color: #e8fbff;
        background: rgba(10, 24, 30, 0.92);
        border: 1px solid #2a6c7a;
        border-radius: 8px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 10;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      body.calibrating {
        cursor: default;
      }
      .calib {
        display: none;
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        font: 14px/1.5 -apple-system, system-ui, sans-serif;
        color: #cfefff;
      }
      .calib-help {
        position: absolute;
        left: 50%;
        top: 38%;
        transform: translate(-50%, -50%);
        text-align: center;
        background: rgba(0, 0, 0, 0.75);
        padding: 12px 18px;
        border: 1px solid #2a6c7a;
        border-radius: 10px;
      }
      .calib-handle {
        position: absolute;
        width: 28px;
        height: 28px;
        margin: -14px 0 0 -14px;
        border: 2px solid #4de6ff;
        border-radius: 50%;
        background: rgba(77, 230, 255, 0.25);
        pointer-events: auto;
        cursor: grab;
        touch-action: none;
      }
      .cam-preview {
        position: fixed;
        left: 8px;
        bottom: 8px;
        width: 320px;
        height: 240px;
        border: 1px solid #2a6c7a;
        border-radius: 6px;
        display: none;
        z-index: 4;
      }
      .stats {
        position: fixed !important;
        left: 8px !important;
        top: 8px !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
